<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eléctricos FC — Panel de Gestión</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <a href="/" data-link class="brand-logo">
      <img src="/images/electricos.png" alt="Eléctricos FC Logo">
      <span class="brand-title">ELÉCTRICOS FC</span>
    </a>
    
    <nav class="desktop-nav">
      <a href="/" data-link class="nav-link">Inicio</a>
      <a href="/calendario" data-link class="nav-link">Calendario</a>
      <a href="/plantilla" data-link class="nav-link">Plantilla</a>
      <a href="/carteles" data-link class="nav-link">Carteles</a>
      <a href="/directo" data-link class="nav-link nav-live">🔴 En Directo</a>
      <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
    </nav>
  </header>

  <main id="app-view" class="main-content">
    <!-- SPA views render here -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="/" data-link class="bottom-nav-item">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Inicio</span>
    </a>
    <a href="/calendario" data-link class="bottom-nav-item">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Calendario</span>
    </a>
    <a href="/directo" data-link class="bottom-nav-item bottom-nav-live">
      <span class="nav-icon">⏱️</span>
      <span class="nav-label">Directo</span>
    </a>
    <a href="/plantilla" data-link class="bottom-nav-item">
      <span class="nav-icon">👥</span>
      <span class="nav-label">Plantilla</span>
    </a>
    <a href="/carteles" data-link class="bottom-nav-item">
      <span class="nav-icon">🎨</span>
      <span class="nav-label">Carteles</span>
    </a>
  </nav>

  <!-- Load JS Modules -->
  <script src="/js/plantilla.js"></script>
  <script src="/js/landing.js"></script>
  <script src="/js/calendario.js"></script>
  <script src="/js/partido.js"></script>
  <script src="/js/partidoDirecto.js"></script>
  <script src="/js/carteles.js"></script>
  <script src="/js/router.js"></script>

  <script>
    async function logout() {
      if (confirm('¿Cerrar sesión en Eléctricos FC?')) {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/login';
      }
    }
  </script>
</body>
</html>
