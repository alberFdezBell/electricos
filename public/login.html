<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acceso — Eléctricos FC</title>
  <link rel="icon" type="image/x-icon" href="/images/electricos.ico">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-header">
      <img src="/images/electricos.png" alt="Eléctricos FC Logo" class="login-logo">
      <h1>ELÉCTRICOS FC</h1>
    </div>

    <form id="loginForm" class="login-card">
      <h2>Iniciar Sesión</h2>
      <div id="loginError" class="alert alert-error hidden"></div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Introduce tu usuario" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Introduce tu contraseña" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Acceder</button>
    </form>

  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = e.target.username.value;
      const password = e.target.password.value;
      const errorDiv = document.getElementById('loginError');

      errorDiv.classList.add('hidden');
      errorDiv.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/';
        } else {
          errorDiv.textContent = data.error || 'Credenciales no válidas';
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        errorDiv.textContent = 'Error de conexión con el servidor.';
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
