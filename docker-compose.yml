version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: electricos-app:latest
    container_name: electricos_app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3005}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/electricos.db
      - SESSION_SECRET=${SESSION_SECRET:-electricos_fc_secret_key_2026}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-electricos2026}
    volumes:
      - electricos_data:/app/data
      - electricos_uploads:/app/public/uploads
    networks:
      - electricos_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: electricos_cloudflare_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - electricos_net

networks:
  electricos_net:
    driver: bridge

volumes:
  electricos_data:
  electricos_uploads:
